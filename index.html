<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: Die App nutzt auf dem iPhone den ganzen Bildschirm (auch um die Kamera-Aussparung herum) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workflow</title>
  <meta name="description" content="Zeit- und Aufgabenplanung mit kritischem Pfad">

  <!-- PWA: Beschreibung der App fürs Installieren -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- iPhone: Icon und Vollbild, wenn die App auf dem Home-Bildschirm liegt -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workflow">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Kopfzeile: Titel der aktuellen Ansicht + Menü-Knopf -->
  <header class="topbar">
    <div>
      <div class="topbar__date" id="topbar-date"></div>
      <h1 class="topbar__title" id="topbar-title">Heute</h1>
    </div>
    <div class="topbar__actions">
      <!-- "+": Neuen Eintrag anlegen -->
      <button class="icon-btn" id="add-btn" aria-label="Neuen Eintrag anlegen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="menu-open" aria-label="Menü öffnen" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <!-- Hier zeigt die App die jeweils gewählte Ansicht an -->
  <main class="content" id="view" tabindex="-1"></main>

  <!-- Leiste unten mit den 5 Hauptansichten -->
  <nav class="tabbar" aria-label="Hauptansichten">
    <a class="tab" href="#heute" data-view="heute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Heute</span>
    </a>
    <a class="tab" href="#woche" data-view="woche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14v4M12 14v4M16 14v4"/></svg>
      <span>Woche</span>
    </a>
    <a class="tab" href="#kalender" data-view="kalender">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Kalender</span>
    </a>
    <a class="tab" href="#ziele" data-view="ziele">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Ziele</span>
    </a>
    <a class="tab" href="#aufgaben" data-view="aufgaben">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg>
      <span>Aufgaben</span>
    </a>
  </nav>

  <!-- Menü (öffnet sich über den Knopf oben rechts) -->
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
  <aside class="menu" id="menu" aria-label="Menü" hidden>
    <div class="menu__head">
      <h2>Menü</h2>
      <button class="icon-btn" id="menu-close" aria-label="Menü schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="menu__group-label">Ansichten</div>
    <ul class="menu__list">
      <li><a href="#heute">Heute</a></li>
      <li><a href="#woche">Woche</a></li>
      <li><a href="#kalender">Kalender</a></li>
      <li><a href="#ziele">Ziele</a></li>
      <li><a href="#aufgaben">Aufgaben</a></li>
    </ul>
    <div class="menu__group-label">Verwalten</div>
    <ul class="menu__list">
      <li><a href="#sperrzeiten">Sperrzeiten</a></li>
      <li><a href="#tagesnotizen">Tagesnotizen</a></li>
      <li><a href="#einstellungen">Einstellungen</a></li>
      <li><a href="#daten">Daten sichern / wiederherstellen</a></li>
    </ul>
    <!-- Sonderordner "Erledigt" liegt ganz unten -->
    <ul class="menu__list menu__list--bottom">
      <li><a href="#erledigt">Erledigt</a></li>
    </ul>
  </aside>

  <!-- Reihenfolge wichtig: erst Datenmodell, dann Speicher, dann App -->
  <script src="model.js"></script>
  <script src="store.js"></script>
  <script src="schedule.js"></script>
  <script src="editor.js"></script>
  <script src="heute.js"></script>
  <script src="aufgaben.js"></script>
  <script src="erledigt.js"></script>
  <script src="app.js"></script>
</body>
</html>
